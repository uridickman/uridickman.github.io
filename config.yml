baseURL: "https://uridickman.github.io" 
title: Uri Dickman
theme: PaperMod

#design:
  #background:
    #image:
      #filename: bg-hue.svg

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Dashboard
          weight: 1
          url: https://uridickman.github.io
        - name: Research
          weight: 2
          url: research
        - name: Publications
          weight: 3
          url: publications
        - name: Code
          weight: 4
          url: code/
        

params:
    description: "This website hosts Uri Dickmnan's resume, contact information, research interests, publications, and public codes."
    author:
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: dark 
    hideFooter: false 
    disableThemeToggle: true 
    ShowShareButtons: false 
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["research", "publications","code"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true 
          title: Uri Dickman
          subtitle: "I am a second-year PhD student in Mechanical Engineering at the University of California, Santa Barbara. My research focus is on the development and application of modern deep learning frameworks to help understand the mechanical behavior of fluids and solid materials. I am working towards a career in leading large-scale high-performance computing research projects at a US national laboratory."
          imageUrl: "profile.jpeg"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Research
              url: research
            - name: Publications
              url: publications
            - name: Code
              url: code/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:udickman@engineering.ucsb.edu
        - name: GitHub
          url: https://github.com/uridickman
        - name: Scholar
          url: https://scholar.google.com/citations?user=-CkgYK8AAAAJ&hl=en&oi=ao
        - name: ORCiD
          url: https://orcid.org/0009-0001-5136-7641
        - name: LinkedIn
          url: https://www.linkedin.com/in/uri-dickman/

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Uri Dickman"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
